<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Expense & Budget Visualizer</h1>
      <button id="themeToggleBtn">🌙 Dark Mode</button>
    </header>

    <!-- Total Balance & Limit Warning -->
    <section class="card balance-card">
      <h2>Total Expenses</h2>
      <div id="totalBalance" class="balance-amount">$0.00</div>
      <div id="limitWarning" class="warning-text hidden">⚠️ Expenses exceed your budget limit!</div>
    </section>

    <!-- Input Form -->
    <section class="card">
      <h3>Add Transaction</h3>
      <form id="transactionForm">
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input type="text" id="itemName" placeholder="e.g. Lunch" required>
        </div>
        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" placeholder="e.g. 15" min="0.01" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="" disabled selected>Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <!-- Transaction List & Sorting -->
    <section class="card">
      <div class="list-header">
        <h3>Transactions</h3>
        <select id="sortSelect">
          <option value="newest">Newest First</option>
          <option value="highest">Highest Amount</option>
          <option value="lowest">Lowest Amount</option>
        </select>
      </div>
      <ul id="transactionList" class="transaction-list"></ul>
    </section>

    <!-- Visual Chart -->
    <section class="card">
      <h3>Spending Distribution</h3>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
