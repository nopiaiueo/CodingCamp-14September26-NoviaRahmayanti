<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Expense & Budget Visualizer</h1>
      <button id="themeToggleBtn">🌙 Dark Mode</button>
    </header>

    <!-- Total Balance & Limit Warning -->
    <section class="card balance-card">
      <h2>Total Pengeluaran</h2>
      <div id="totalBalance" class="balance-amount">Rp 0</div>
      <div id="limitWarning" class="warning-text hidden">⚠️ Pengeluaran melebihi limit!</div>
    </section>

    <!-- Input Form -->
    <section class="card">
      <h3>Tambah Transaksi</h3>
      <form id="transactionForm">
        <div class="form-group">
          <label for="itemName">Nama Item</label>
          <input type="text" id="itemName" placeholder="Contoh: Nasi Goreng" required>
        </div>
        <div class="form-group">
          <label for="amount">Jumlah (Rp)</label>
          <input type="number" id="amount" placeholder="Contoh: 20000" min="1" required>
        </div>
        <div class="form-group">
          <label for="category">Kategori</label>
          <select id="category" required>
            <option value="" disabled selected>Pilih Kategori</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Tambah</button>
      </form>
    </section>

    <!-- Transaction List & Sorting -->
    <section class="card">
      <div class="list-header">
        <h3>Daftar Transaksi</h3>
        <select id="sortSelect">
          <option value="newest">Terbaru</option>
          <option value="highest">Jumlah Tertinggi</option>
          <option value="lowest">Jumlah Terendah</option>
        </select>
      </div>
      <ul id="transactionList" class="transaction-list"></ul>
    </section>

    <!-- Visual Chart -->
    <section class="card">
      <h3>Distribusi Pengeluaran</h3>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
